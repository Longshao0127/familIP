port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🇹🇷 土耳其 (Turkey) 01 (移动家宽) - xiaohe
  server: v2new.nimbaha9.ir
  port: 8080
  udp: true
  type: vless
  uuid: 308230a0-0097-4158-98d7-8f09bf339d60
  network: ws
  ws-opts:
    path: /XDS45
    headers:
      Host: v2new.nimbaha9.ir
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🇹🇷 土耳其 (Turkey) 01 (移动家宽) - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇹🇷 土耳其 (Turkey) 01 (移动家宽) - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇹🇷 土耳其 (Turkey) 01 (移动家宽) - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇹🇷 土耳其 (Turkey) 01 (移动家宽) - xiaohe
rules:
- MATCH,PROXIES
