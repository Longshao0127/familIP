port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🇺🇸 美国 (United States) 01 (家宽) - xiaohe
  server: 104.18.0.1
  port: 443
  udp: true
  type: vless
  uuid: 3ccba794-1c6d-48a8-acf2-f5caf0e69d86
  tls: true
  servername: all.speedtest03.ccwu.cc
  skip-cert-verify: false
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /
    headers:
      Host: all.speedtest03.ccwu.cc
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🇺🇸 美国 (United States) 01 (家宽) - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇺🇸 美国 (United States) 01 (家宽) - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇺🇸 美国 (United States) 01 (家宽) - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇺🇸 美国 (United States) 01 (家宽) - xiaohe
rules:
- MATCH,PROXIES
