port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🇱🇰 斯里兰卡 (Sri Lanka) 01 - xiaohe
  server: 170.114.46.6
  port: 2096
  udp: true
  type: vless
  uuid: efd11a89-7506-44ce-95b6-6654859f155b
  tls: true
  servername: pcloud.z-tas.com
  skip-cert-verify: false
  client-fingerprint: firefox
  network: ws
  ws-opts:
    path: /
    headers:
      Host: pcloud.z-tas.com
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🇱🇰 斯里兰卡 (Sri Lanka) 01 - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇱🇰 斯里兰卡 (Sri Lanka) 01 - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇱🇰 斯里兰卡 (Sri Lanka) 01 - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇱🇰 斯里兰卡 (Sri Lanka) 01 - xiaohe
rules:
- MATCH,PROXIES
