port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🎵 🇹🇷 土耳其 (Turkey) 01(移动) - xiaohe
  server: v2new.nimbaha9.ir
  port: 8080
  udp: true
  type: vless
  uuid: 308230a0-0097-4158-98d7-8f09bf339d60
  network: ws
  ws-opts:
    path: /XDS45
    headers:
      Host: v2new.nimbaha9.ir
- name: 🎵 🇹🇷 土耳其 (Turkey) 02(机房) - xiaohe
  server: 143.246.136.128
  port: 50738
  udp: true
  type: vless
  uuid: 56665684-5ac0-4ba9-9d49-8b258fb57974
  tls: true
  servername: turkey-ip1.mmdaqaorg.xyz
  skip-cert-verify: false
  client-fingerprint: chrome
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🎵 🇹🇷 土耳其 (Turkey) 01(移动) - xiaohe
  - 🎵 🇹🇷 土耳其 (Turkey) 02(机房) - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇹🇷 土耳其 (Turkey) 01(移动) - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇹🇷 土耳其 (Turkey) 01(移动) - xiaohe
  - 🎵 🇹🇷 土耳其 (Turkey) 02(机房) - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇹🇷 土耳其 (Turkey) 01(移动) - xiaohe
  - 🎵 🇹🇷 土耳其 (Turkey) 02(机房) - xiaohe
rules:
- MATCH,PROXIES
