port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🇨🇳 CN 01 - xiaohe
  server: 172.67.166.188
  port: 443
  udp: true
  type: vless
  uuid: fc7d2cfe-f5ef-40c8-a848-a0bdc11f6349
  tls: true
  servername: vpn.cintaku.qzz.io
  skip-cert-verify: false
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /vlessws
    headers:
      Host: vpn.cintaku.qzz.io
- name: 🇨🇳 CN 02 - xiaohe
  server: 8.35.211.242
  port: 443
  udp: true
  type: vless
  uuid: fc7d2cfe-f5ef-40c8-a848-a0bdc11f6349
  tls: true
  servername: vpn.cintaku.qzz.io
  skip-cert-verify: false
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /vlessws
    headers:
      Host: vpn.cintaku.qzz.io
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🇨🇳 CN 01 - xiaohe
  - 🇨🇳 CN 02 - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇨🇳 CN 01 - xiaohe
  - 🇨🇳 CN 02 - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇨🇳 CN 01 - xiaohe
  - 🇨🇳 CN 02 - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇨🇳 CN 01 - xiaohe
  - 🇨🇳 CN 02 - xiaohe
rules:
- MATCH,PROXIES
