port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🎵 🇪🇪 爱沙尼亚 (Estonia) 01(机房) - xiaohe
  server: est.luxes.network
  port: 8443
  udp: true
  type: vless
  uuid: a9e5d7ed-ce1a-48eb-9767-4de54fcfaba7
  tls: true
  servername: est.luxes.network
  skip-cert-verify: false
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /assets
    headers:
      Host: est.luxes.network
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🎵 🇪🇪 爱沙尼亚 (Estonia) 01(机房) - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇪🇪 爱沙尼亚 (Estonia) 01(机房) - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇪🇪 爱沙尼亚 (Estonia) 01(机房) - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇪🇪 爱沙尼亚 (Estonia) 01(机房) - xiaohe
rules:
- MATCH,PROXIES
