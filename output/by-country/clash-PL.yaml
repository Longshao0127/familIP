port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🇵🇱 波兰 (Poland) 01 - xiaohe
  server: devcdn.icu
  port: 443
  udp: true
  type: vless
  uuid: b432a23a-acff-425c-bf69-70480cd6ed09
  tls: true
  servername: devcdn.icu
  skip-cert-verify: false
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /edge/chunk/b2265efffa29/
    headers:
      Host: devcdn.icu
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🇵🇱 波兰 (Poland) 01 - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇵🇱 波兰 (Poland) 01 - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇵🇱 波兰 (Poland) 01 - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇵🇱 波兰 (Poland) 01 - xiaohe
rules:
- MATCH,PROXIES
