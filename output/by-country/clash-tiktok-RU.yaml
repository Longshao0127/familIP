port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🎵 🇷🇺 俄罗斯 (Russia) 01(机房) - xiaohe
  server: xsru1.ddnsfree.com
  port: 443
  udp: true
  type: vless
  uuid: c90395e6-2140-47ad-a54d-9b166729d3ef
  tls: true
  servername: xsru1.ddnsfree.com
  skip-cert-verify: false
  client-fingerprint: random
  network: grpc
  grpc-opts:
    grpc-service-name: grpc-ru
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-TCP
  - AUTO
  - 🎵 🇷🇺 俄罗斯 (Russia) 01(机房) - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇷🇺 俄罗斯 (Russia) 01(机房) - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🎵 🇷🇺 俄罗斯 (Russia) 01(机房) - xiaohe
rules:
- MATCH,PROXIES
