port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🇮🇩 印尼 (Indonesia) 01 - xiaohe
  server: 104.17.3.81
  port: 443
  udp: true
  type: vless
  uuid: 12d67d2b-ae5c-4d56-9f14-d71d96f7826f
  tls: true
  servername: natan.srpcom.cloud
  skip-cert-verify: false
  network: ws
  ws-opts:
    path: /vlessws
    headers:
      Host: natan.srpcom.cloud
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🇮🇩 印尼 (Indonesia) 01 - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇮🇩 印尼 (Indonesia) 01 - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇮🇩 印尼 (Indonesia) 01 - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🇮🇩 印尼 (Indonesia) 01 - xiaohe
rules:
- MATCH,PROXIES
