port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🌐 其他地区 (Other) 01 - xiaohe
  server: 104.17.50.227
  port: 443
  udp: true
  type: vless
  uuid: 4e4f1f70-5e56-4a76-bb9d-db087f4690c4
  tls: true
  servername: jp3.yohototo.top
  skip-cert-verify: false
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /tyxyws
    headers:
      Host: jp3.yohototo.top
- name: 🌐 其他地区 (Other) 02 - xiaohe
  server: 104.17.50.227
  port: 443
  udp: true
  type: vless
  uuid: 4e4f1f70-5e56-4a76-bb9d-db087f4690c4
  tls: true
  servername: jp3.yohototo.top
  skip-cert-verify: false
  network: ws
  ws-opts:
    path: /tyxyws
