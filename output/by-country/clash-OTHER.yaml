  - 🌐 其他地区 (Other) 01 - xiaohe
  - 🌐 其他地区 (Other) 02 - xiaohe
  - 🌐 其他地区 (Other) 03 - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
