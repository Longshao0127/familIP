port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.
  - +.msftconnecttest.com
  - +.msftncsi.com
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true
proxies:
- name: 🌐 其他地区 (Other) 01 - xiaohe
  server: www.gptcloudai.com
  port: 443
  udp: true
  type: vmess
  uuid: e70a5b70-f63c-4450-af8b-94990cdf80c0
  alterId: 0
  cipher: auto
  tls: true
  servername: www.gptcloudai.com
  skip-cert-verify: false
  network: ws
  ws-opts:
    path: /truth
    headers:
      Host: www.gptcloudai.com
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO-CN
  - AUTO-TCP
  - AUTO
  - 🌐 其他地区 (Other) 01 - xiaohe
- name: AUTO-CN
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🌐 其他地区 (Other) 01 - xiaohe
- name: AUTO-TCP
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🌐 其他地区 (Other) 01 - xiaohe
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  proxies:
  - 🌐 其他地区 (Other) 01 - xiaohe
rules:
- MATCH,PROXIES
