name: Update Subscriptions

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update.yml']
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Clean old sing-box temp configs
        run: |
          rm -f runtime/sb_*.json

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'
          # ══ 可选: 海外前置代理 ══
          # 如果你自己有海外代理服务器 (socks5://host:port), 在 GitHub Repo → Settings → Secrets and variables → Actions
          # 添加 FRONT_PROXY = socks5://你的代理IP:端口, 这里会自动注入, 提升 Actions 上节点存活率
          FRONT_PROXY: ${{ secrets.FRONT_PROXY }}
          # 中国侧可达性探测 (Globalping 免费额度 250/小时, 每轮 120 次)
          CN_PROBE: '1'
          CN_PROBE_BUDGET: '120'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          [ -d data ] && git add -A data/ || true
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json v2ray-cn.txt clash-cn.yaml singbox-cn.json residential.txt residential-clash.yaml residential-singbox.json tiktok.txt tiktok-clash.yaml tiktok-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
